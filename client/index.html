<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arcade Hub">
  <meta name="description" content="Мультиплеерные гонки и аркады с друзьями">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>Arcade Hub</title>
  <style>
    :root {
      --panel: rgba(12,14,18,.62);
      --text: #f2f4f7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #0c0e12;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }
    #menu {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0c1220 0%, #1a2233 50%, #0e1624 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 20; text-align: center; padding: 24px;
      touch-action: auto;
    }
    #menu h1 { margin: 0 0 6px; font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em; }
    #menu .sub { opacity: .7; margin-bottom: 28px; }
    .card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 24px 28px;
      width: min(360px, 100%);
    }
    .card label { display: block; text-align: left; font-size: 13px; opacity: .7; margin-bottom: 4px; }
    .card input {
      width: 100%; padding: 11px 14px; border-radius: 10px;
      border: 1px solid #3a4150; background: #12161e; color: var(--text);
      font-size: 16px; margin-bottom: 14px;
    }
    .card input:focus { outline: 2px solid #4a9eff; outline-offset: 1px; }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .btns button {
      flex: 1; padding: 12px 16px; border-radius: 10px; border: 0;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #c1121f; color: #fff; }
    .btn-secondary { background: #2a3344; color: #e8ecf4; }
    .btn-ghost {
      background: transparent; color: #a8b0c0;
      border: 1px solid #3a4150 !important;
      margin-top: 10px; width: 100%;
    }
    #status { margin-top: 14px; font-size: 13px; opacity: .6; min-height: 1.2em; }
    #installBtn {
      display: none; margin-top: 12px; width: 100%;
      padding: 10px 16px; border-radius: 10px; border: 1px solid #4a9eff;
      background: rgba(74,158,255,.12); color: #cfe3ff;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #hud {
      position: absolute; left: 16px; bottom: 16px;
      background: var(--panel); border-radius: 10px;
      padding: 10px 16px; pointer-events: none;
      backdrop-filter: blur(6px); display: none; z-index: 5;
    }
    #speed { font-size: 2.4rem; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; }
    #speed small { font-size: 1rem; font-weight: 400; opacity: .75; margin-left: 4px; }
    #keys {
      position: absolute; top: 16px; left: 16px;
      background: var(--panel); border-radius: 10px;
      padding: 10px 14px; font-size: 13px; line-height: 1.55;
      pointer-events: none; backdrop-filter: blur(6px); display: none; z-index: 5;
    }
    #players {
      position: absolute; top: 16px; right: 16px; min-width: 200px;
      background: var(--panel); border-radius: 10px;
      padding: 10px 14px; font-size: 13px; line-height: 1.55;
      pointer-events: none; backdrop-filter: blur(6px); display: none; z-index: 5;
    }
    #back {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--panel); border: 0; color: var(--text);
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-size: 13px; display: none; z-index: 15;
    }
    #copyLink {
      position: absolute; top: 16px; left: calc(50% + 70px);
      background: var(--panel); border: 0; color: var(--text);
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-size: 13px; display: none; z-index: 15;
    }
    #overlay {
      position: absolute; inset: 0; display: none;
      justify-content: center; align-items: center;
      z-index: 12; pointer-events: none;
      background: rgba(0,0,0,.25);
    }
    #overlay.show { display: flex; }
    #overlayText {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 800;
      text-shadow: 0 4px 24px rgba(0,0,0,.5);
      letter-spacing: 0.04em;
    }
    #results {
      position: absolute; inset: 0; display: none;
      justify-content: center; align-items: center;
      z-index: 14; background: rgba(8,10,16,.78);
      backdrop-filter: blur(8px);
    }
    #results.show { display: flex; }
    #resultsBox {
      background: rgba(20,24,34,.95);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 24px 28px;
      min-width: min(320px, 90vw);
      text-align: center;
    }
    #resultsBox h2 { margin: 0 0 16px; font-size: 1.4rem; }
    #resultsList { text-align: left; line-height: 1.8; font-size: 15px; }
    #resultsList .place1 { color: #ffd700; font-weight: 700; }
    #resultsList .place2 { color: #c0c0c0; }
    #resultsList .place3 { color: #cd7f32; }

    #mobile {
      display: none;
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 8;
    }
    #mobile.show { display: block; }
    .stick-zone {
      position: absolute; left: 12px; bottom: 24px;
      width: 140px; height: 140px;
      pointer-events: auto;
    }
    .stick-base {
      position: absolute; inset: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.2);
    }
    .stick-knob {
      position: absolute; width: 56px; height: 56px;
      left: 50%; top: 50%; margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      border: 2px solid rgba(255,255,255,.5);
    }
    .pedals {
      position: absolute; right: 16px; bottom: 28px;
      display: flex; flex-direction: column; gap: 12px;
      pointer-events: auto;
    }
    .pedal {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.12);
      color: #fff; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .pedal:active, .pedal.on {
      background: rgba(193,18,31,.7);
      border-color: rgba(255,255,255,.5);
    }
    .pedal.brake.on { background: rgba(40,40,50,.85); }

    @media (max-width: 900px), (pointer: coarse) {
      #keys { display: none !important; }
      #mobile.show { display: block; }
      #hud { bottom: 180px; left: 12px; }
      #players { font-size: 12px; max-width: 42vw; }
      #copyLink { left: auto; right: 12px; top: auto; bottom: 12px; transform: none; }
      #back { top: 12px; }
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Arcade Hub</h1>
    <p class="sub">Гонки и другие игры с друзьями и незнакомцами</p>
    <div class="card">
      <label for="nick">Ваш ник</label>
      <input id="nick" maxlength="14" placeholder="Гонщик" autocomplete="off">
      <label for="code">Код комнаты (для друзей)</label>
      <input id="code" maxlength="20" placeholder="garage" value="garage" autocomplete="off">
      <div class="btns">
        <button class="btn-primary" id="joinCode">Войти в комнату</button>
        <button class="btn-secondary" id="quick">Быстрая игра</button>
      </div>
      <button class="btn-ghost" id="shareMenu" type="button">Скопировать ссылку на комнату</button>
      <button id="installBtn" type="button">Установить приложение</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="keys">
    <b>W / ↑</b> газ &nbsp; <b>S / ↓</b> тормоз и назад<br>
    <b>A / ←</b> влево &nbsp; <b>D / →</b> вправо<br>
    <b>Пробел</b> ручник
  </div>
  <div id="hud">
    <div id="speed">0<small>км/ч</small></div>
    <div id="lap" style="margin-top:6px;font-size:13px;opacity:.85"></div>
  </div>
  <div id="players"></div>
  <button id="back">← Меню</button>
  <button id="copyLink">Ссылка</button>

  <div id="overlay"><div id="overlayText"></div></div>
  <div id="results">
    <div id="resultsBox">
      <h2>Финиш</h2>
      <div id="resultsList"></div>
      <p style="opacity:.6;font-size:13px;margin:16px 0 0">Следующий заезд скоро…</p>
    </div>
  </div>

  <div id="mobile">
    <div class="stick-zone" id="stickZone">
      <div class="stick-base"></div>
      <div class="stick-knob" id="stickKnob"></div>
    </div>
    <div class="pedals">
      <button class="pedal" id="btnGas" type="button">ГАЗ</button>
      <button class="pedal brake" id="btnBrake" type="button">ТОРМОЗ</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
